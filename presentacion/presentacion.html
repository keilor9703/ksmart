    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --o:  #FF6020;
      --o1: rgba(255,96,32,0.12);
      --o2: rgba(255,96,32,0.22);
      --bg: #09090b;
      --card: rgba(255,255,255,0.04);
      --bdr: rgba(255,255,255,0.08);
      --txt: #f1f5f9;
      --dim: rgba(255,255,255,0.5);

    html, body { width:100%; height:100%; background:var(--bg); color:var(--txt);
      font-family:'Segoe UI',system-ui,-apple-system,sans-serif; overflow:hidden; }

    .slide {
      position:absolute; inset:0;
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      padding:clamp(1.5rem,4vw,4rem);
      opacity:0; pointer-events:none;
      transform:translateX(70px);
      transition:opacity .42s ease, transform .42s ease;
    }
    .slide.active  { opacity:1; pointer-events:all; transform:translateX(0); }
    .slide.exit    { opacity:0; transform:translateX(-70px); }
    .inner         { width:100%; max-width:1320px; }

    .tag {
      display:inline-flex; align-items:center; gap:.4rem;
      padding:.3rem .85rem; border-radius:20px;
      font-size:.6rem; font-weight:800; letter-spacing:2px; text-transform:uppercase;
      margin-bottom:.9rem;

    .t-o { background:rgba(255,96,32,.12); color:var(--o); border:1px solid rgba(255,96,32,.25); }
    .t-b { background:rgba(59,130,246,.12); color:#60a5fa; border:1px solid rgba(59,130,246,.25); }
    .t-g { background:rgba(34,197,94,.12);  color:#4ade80; border:1px solid rgba(34,197,94,.25); }
    .t-p { background:rgba(139,92,246,.12); color:#a78bfa; border:1px solid rgba(139,92,246,.25); }
    .t-c { background:rgba(6,182,212,.12);  color:#22d3ee; border:1px solid rgba(6,182,212,.25); }

    h1 { font-size:clamp(3rem,7vw,5.5rem); font-weight:900; line-height:1; letter-spacing:-.02em; }
    h2 { font-size:clamp(1.6rem,3.2vw,2.6rem); font-weight:800; line-height:1.1; letter-spacing:-.01em; }

    .grad { background:linear-gradient(135deg,#FF6020,#ff9d00);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .grad-b { background:linear-gradient(135deg,#3b82f6,#06b6d4);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }

    .sub { font-size:.95rem; color:var(--dim); margin-top:.5rem; line-height:1.6; }

    .card  { background:var(--card); border:1px solid var(--bdr); border-radius:14px; padding:1.2rem; }
    .g     { display:grid; gap:.85rem; }
    .g2    { grid-template-columns:repeat(2,1fr); }
    .g3    { grid-template-columns:repeat(3,1fr); }
    .g4    { grid-template-columns:repeat(4,1fr); }
    .g5    { grid-template-columns:repeat(5,1fr); }

    #logo { position:fixed; top:1.25rem; left:2rem; font-weight:900; font-size:.9rem;
      color:var(--o); z-index:200; letter-spacing:-.5px; }
    #cnt  { position:fixed; top:1.25rem; right:2rem; font-size:.7rem;
      color:rgba(255,255,255,.25); z-index:200; }

    #dots { position:fixed; bottom:1.75rem; left:50%; transform:translateX(-50%);
      display:flex; gap:.45rem; z-index:200; }
    .dot  { width:7px; height:7px; border-radius:4px; background:rgba(255,255,255,.18);
      cursor:pointer; transition:all .3s; }
    .dot.on { width:22px; background:var(--o); }

    .arr  { position:fixed; top:50%; transform:translateY(-50%);
      width:44px; height:44px; border-radius:50%;
      background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);

    #a-l { left:1.25rem; } #a-r { right:1.25rem; }

    @keyframes glow  { 0%,100%{box-shadow:0 0 30px rgba(255,96,32,.3),0 0 60px rgba(255,96,32,.1)} 50%{box-shadow:0 0 55px rgba(255,96,32,.55),0 0 110px rgba(255,96,32,.2)} }
    @keyframes blink { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }
    @keyframes pulse-border { 0%,100%{border-color:rgba(255,96,32,.3)} 50%{border-color:rgba(255,96,32,.7)} }

    .live { display:inline-flex; align-items:center; gap:.4rem; font-size:.75rem; color:#4ade80; }
    .live-dot { width:7px; height:7px; background:#4ade80; border-radius:50%; animation:blink 2s ease-in-out infinite; }

//  Navigation engine
// ═══════════════════════════════════════════════════════════════
const slides = document.querySelectorAll('.slide');
const dotsEl = document.getElementById('dots');
const cntEl  = document.getElementById('cnt');
let cur = 0;

slides.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' on' : '');
  d.addEventListener('click', () => go(i));
  dotsEl.appendChild(d);
});

function go(n) {
  if (n === cur || n < 0 || n >= slides.length) return;
  slides[cur].classList.remove('active');
  slides[cur].classList.add('exit');
  const prev = cur;
  cur = n;
  slides[cur].classList.add('active');
  setTimeout(() => slides[prev].classList.remove('exit'), 500);
  document.querySelectorAll('.dot').forEach((d, i) => d.className = 'dot' + (i === cur ? ' on' : ''));
  cntEl.textContent = (cur + 1) + ' / ' + slides.length;
}

document.getElementById('a-l').addEventListener('click', () => go(cur - 1));
document.getElementById('a-r').addEventListener('click', () => go(cur + 1));
document.addEventListener('keydown', e => {
  if (['ArrowRight','ArrowDown',' '].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  if (['ArrowLeft','ArrowUp'].includes(e.key))        { e.preventDefault(); go(cur - 1); }
});

slides[0].classList.add('active');
cntEl.textContent = '1 / ' + slides.length;
</script>
