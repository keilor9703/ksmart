<?xml version="1.0" encoding="UTF-8"?>
<!-- Logo 01 — Google Style: Multicolor, fondo blanco, bordes redondeados -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="rgba(0,0,0,0.12)"/>
    </filter>
  </defs>

  <!-- Fondo blanco con borde sutil -->
  <rect width="100" height="100" rx="22" fill="#FFFFFF" filter="url(#shadow1)"/>
  <rect width="100" height="100" rx="22" fill="none" stroke="#E8EAED" stroke-width="1.5"/>

  <!-- Barra vertical izquierda — Azul Google -->
  <line x1="28" y1="19" x2="28" y2="81"
        stroke="#4285F4" stroke-width="11" stroke-linecap="round"/>

  <!-- Brazo inferior diagonal — Rojo Google -->
  <line x1="28" y1="50" x2="73" y2="86"
        stroke="#EA4335" stroke-width="11" stroke-linecap="round"/>

  <!-- Brazo superior diagonal — Verde Google -->
  <line x1="28" y1="50" x2="55" y2="28"
        stroke="#34A853" stroke-width="11" stroke-linecap="round"/>

  <!-- Punta de flecha — Amarillo Google -->
  <polygon points="73,14 65,33 53,17" fill="#FBBC04"/>
</svg>
