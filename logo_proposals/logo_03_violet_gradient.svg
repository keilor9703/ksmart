<?xml version="1.0" encoding="UTF-8"?>
<!-- Logo 03 — Gradiente Violeta-Índigo: fluye de abajo-izquierda a arriba-derecha -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <!-- Gradiente de la K: sigue la diagonal del movimiento ascendente -->
    <linearGradient id="kgrad" x1="28" y1="86" x2="73" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <!-- Fondo: lavanda muy suave -->
    <linearGradient id="bggrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F5F0FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#bggrad)"/>

  <line x1="28" y1="19" x2="28" y2="81"
        stroke="url(#kgrad)" stroke-width="11" stroke-linecap="round"/>
  <line x1="28" y1="50" x2="73" y2="86"
        stroke="url(#kgrad)" stroke-width="11" stroke-linecap="round"/>
  <line x1="28" y1="50" x2="55" y2="28"
        stroke="url(#kgrad)" stroke-width="11" stroke-linecap="round"/>

  <!-- Punta de flecha en el tono claro del gradiente -->
  <polygon points="73,14 65,33 53,17" fill="#818CF8"/>
</svg>
