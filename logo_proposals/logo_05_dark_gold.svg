<?xml version="1.0" encoding="UTF-8"?>
<!-- Logo 05 — Dark Premium Gold: fondo azul-marino oscuro, K en degradado dorado -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <!-- Gradiente dorado: ámbar profundo → oro brillante (sigue la K hacia arriba) -->
    <linearGradient id="gold" x1="28" y1="86" x2="73" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#B45309"/>
      <stop offset="60%"  stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <!-- Fondo marino muy oscuro con leve gradiente -->
    <linearGradient id="navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0C1022"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#navy)"/>

  <line x1="28" y1="19" x2="28" y2="81"
        stroke="url(#gold)" stroke-width="11" stroke-linecap="round"/>
  <line x1="28" y1="50" x2="73" y2="86"
        stroke="url(#gold)" stroke-width="11" stroke-linecap="round"/>
  <line x1="28" y1="50" x2="55" y2="28"
        stroke="url(#gold)" stroke-width="11" stroke-linecap="round"/>

  <!-- Punta de flecha en el tono más brillante del degradado -->
  <polygon points="73,14 65,33 53,17" fill="#FDE68A"/>
</svg>
