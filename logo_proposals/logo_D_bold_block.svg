<?xml version="1.0" encoding="UTF-8"?>
<!-- Logo D — Block Bold: K de trazos MUY gruesos, como tipografía display ultra-bold -->
<!-- Impacto visual máximo, estilo Nike/Netflix pero en cian -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="boldgrad" x1="20%" y1="90%" x2="80%" y2="10%">
      <stop offset="0%"   stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="#030B15"/>

  <g filter="url(#softglow)">
    <!-- Barra — muy gruesa, presencia fuerte -->
    <line x1="24" y1="17" x2="24" y2="83"
          stroke="url(#boldgrad)" stroke-width="16" stroke-linecap="round"/>

    <!-- Brazo inferior — grueso -->
    <line x1="24" y1="50" x2="76" y2="84"
          stroke="url(#boldgrad)" stroke-width="16" stroke-linecap="round"/>

    <!-- Brazo superior (cuerpo hasta antes de flecha) -->
    <line x1="24" y1="50" x2="52" y2="26"
          stroke="url(#boldgrad)" stroke-width="16" stroke-linecap="round"/>

    <!-- Punta de flecha — extra grande para equilibrar el grosor -->
    <!-- Tip (78,12), alas (65,37) y (51,20) -->
    <polygon points="78,12  65,38  51,20" fill="#FFFFFF"/>
  </g>
</svg>
