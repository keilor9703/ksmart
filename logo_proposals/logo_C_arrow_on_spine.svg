<?xml version="1.0" encoding="UTF-8"?>
<!-- Logo C — Flecha vertical en la espina: la barra de la K ES la flecha hacia arriba -->
<!-- Concepto: el tronco vertical lleva la punta arriba, y los brazos salen hacia la derecha -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="spinegrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="#020817"/>

  <g filter="url(#glow)">
    <!-- Barra vertical — la flecha corre de abajo hacia arriba -->
    <!-- Termina antes de la punta para que el arrowhead cubra el round-cap -->
    <line x1="32" y1="26" x2="32" y2="81"
          stroke="url(#spinegrad)" stroke-width="11" stroke-linecap="round"/>

    <!-- Punta de flecha recta hacia arriba (ancha y prominente) -->
    <!-- Tip en (32, 9), alas en (16, 28) y (48, 28) -->
    <polygon points="32,9  16,29  48,29" fill="#FFFFFF"/>

    <!-- Brazo superior — sale del punto medio hacia arriba-derecha -->
    <line x1="32" y1="46" x2="76" y2="20"
          stroke="#06B6D4" stroke-width="11" stroke-linecap="round"/>

    <!-- Brazo inferior — sale del punto medio hacia abajo-derecha -->
    <line x1="32" y1="56" x2="76" y2="82"
          stroke="#06B6D4" stroke-width="11" stroke-linecap="round"/>
  </g>
</svg>
