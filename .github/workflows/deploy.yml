name: Deploy to OCI

# Se activa con cada push a main
on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy backend to OCI Ampere
    runs-on: ubuntu-latest

    steps:
      - name: SSH → git pull + rebuild backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key:      ${{ secrets.OCI_SSH_KEY }}
          # Timeout generoso por si el build tarda (descarga de capas Docker)
          command_timeout: 15m
          script: |
            set -e
            cd /opt/ksmart

            echo "=== git pull ==="
            git pull origin main

            echo "=== Rebuild backend + nginx ==="
            # Solo reconstruye backend y nginx.
            # db y pgbouncer NO se tocan para no interrumpir conexiones.
            docker compose up -d --build backend nginx

            echo "=== Limpieza de imágenes antiguas ==="
            docker image prune -f

            echo "=== Estado final ==="
            docker compose ps
