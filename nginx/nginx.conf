# ──────────────────────────────────────────────────────────────────────────────
# Nginx — Reverse proxy para Ksmart360 Backend (FastAPI)
#
# FASE 1 (sin SSL): solo HTTP en puerto 80.
# FASE 2 (con SSL): descomenta el bloque HTTPS y ejecuta Certbot.
# ──────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;   # Acepta cualquier host; cambia a tu dominio cuando tengas uno

    # Verificación de Let's Encrypt (Certbot crea archivos aquí)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás va al backend FastAPI
    location / {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte WebSocket (para futuras funciones en tiempo real)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts generosos para operaciones largas (imports, reportes)
        proxy_read_timeout    300s;
        proxy_connect_timeout  75s;
        proxy_send_timeout    300s;

        client_max_body_size 20M;
    }
}

