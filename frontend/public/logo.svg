<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fondo oscuro con bordes redondeados (estilo iOS/Android) -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="kGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6020"/>
      <stop offset="100%" stop-color="#ff9a62"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGradient)"/>

  <!-- Letra K estilizada con gradiente naranja -->
  <g filter="url(#shadow)">
    <!-- Vertical de la K -->
    <rect x="130" y="120" width="58" height="272" rx="10" fill="url(#kGradient)"/>
    <!-- Diagonal superior (\) -->
    <path d="M 188 256 L 360 120 L 384 152 L 230 270 Z" fill="url(#kGradient)"/>
    <!-- Diagonal inferior (/) -->
    <path d="M 188 256 L 360 392 L 384 360 L 230 242 Z" fill="url(#kGradient)"/>
  </g>

  <!-- Punto de acento (estilo "360") -->
  <circle cx="392" cy="138" r="13" fill="url(#kGradient)" opacity="0.95"/>
</svg>
