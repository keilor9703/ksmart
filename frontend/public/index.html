<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />

    <!-- ════════════════════════════════════════════════════════════════════ -->
    <!-- TÍTULO Y FAVICON — pestaña del navegador                             -->
    <!-- ════════════════════════════════════════════════════════════════════ -->
    <title>Ksmart360</title>

    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />

    <!-- ════════════════════════════════════════════════════════════════════ -->
    <!-- iOS — añadir a pantalla de inicio                                    -->
    <!-- ════════════════════════════════════════════════════════════════════ -->
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Ksmart" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- ════════════════════════════════════════════════════════════════════ -->
    <!-- Android / Chrome — barra de estado en azul oscuro                    -->
    <!-- ════════════════════════════════════════════════════════════════════ -->
    <meta name="theme-color" content="#0d1117" />
    <meta name="application-name" content="Ksmart" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Manifest PWA -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ════════════════════════════════════════════════════════════════════ -->
    <!-- SEO básico                                                           -->
    <!-- ════════════════════════════════════════════════════════════════════ -->
    <meta name="description" content="Ksmart360 — Sistema integral de gestión empresarial. Ventas, inventario, parqueadero, préstamos y más." />

    <!-- Open Graph (al compartir en WhatsApp/redes) -->
    <meta property="og:title" content="Ksmart360" />
    <meta property="og:description" content="Sistema integral de gestión empresarial." />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ksmart360" />
    <meta name="twitter:description" content="Sistema integral de gestión empresarial." />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo512.png" />

    <!-- ════════════════════════════════════════════════════════════════════ -->
    <!-- Tipografía Plus Jakarta Sans                                         -->
    <!-- ════════════════════════════════════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para usar Ksmart360.</noscript>
    <div id="root"></div>
	
    <script type="text/javascript" src="https://checkout.wompi.co/widget.js"></script>
  </body>
</html>
