apply plugin: 'com.android.application'

android {
    namespace = "com.tstechstack.ksmart360"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.tstechstack.ksmart360"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.3.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Firma de release: se toma del keystore real (vía variables de entorno inyectadas
    // por CI como secretos) si está disponible; si no, cae a un debug signing local
    // para que `assembleRelease` siga funcionando en desarrollo sin el keystore real.
    def releaseStorePath = System.getenv("KSMART_KEYSTORE_PATH")
    def hasReleaseSigning = releaseStorePath != null && file(releaseStorePath).exists()

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStorePath)
                storePassword System.getenv("KSMART_KEYSTORE_PASSWORD")
                keyAlias System.getenv("KSMART_KEY_ALIAS")
                keyPassword System.getenv("KSMART_KEY_PASSWORD")
            }
        }
        // Llave FIJA para el APK debug de distribución interna (sideload). Sin
        // esto, cada build de CI usaría una debug.keystore generada al azar y
        // Android rechazaría la actualización con "conflicto con un paquete"
        // (firmas distintas). Al versionar esta llave, todos los builds quedan
        // firmados igual y las actualizaciones se instalan encima sin problema.
        ksmartDebug {
            storeFile file('ksmart-debug.keystore')
            storePassword 'ksmart2024'
            keyAlias 'ksmart'
            keyPassword 'ksmart2024'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.ksmartDebug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.ksmartDebug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // SDK de impresión de Sunmi (PrinterX) — está en Maven Central, no requiere
    // repositorio adicional. Usado por el plugin nativo SunmiPrinter para
    // imprimir recibos en la impresora térmica integrada del dispositivo.
    implementation 'com.sunmi:printerx:1.0.20'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
